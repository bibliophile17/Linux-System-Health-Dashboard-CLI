# OPTIONAL: Prometheus + Grafana OSS in Docker, bound to loopback only.
# The syshealth exporter itself runs on the host:  python3 -m syshealth exporter
# Host networking (Linux) lets Prometheus reach the exporter on the host's 127.0.0.1.
#
#   export GRAFANA_ADMIN_PASSWORD='choose-a-strong-one'      # required, no default password
#   docker compose -f monitoring/docker-compose.yml up -d
#   docker compose -f monitoring/docker-compose.yml down -v  # stop AND delete the stored data
#
# Image tags are pinned to specific releases; update them deliberately.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.3.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD before starting}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/syshealth-dashboard.json:/var/lib/grafana/dashboards/syshealth-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
